<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Live Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1200px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo i {
            font-size: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 600;
        }
        .logout-btn {
            background: linear-gradient(135deg, #f72585, #b5179e);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
        }
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(247, 37, 133, 0.6);
        }
        .main-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .video-section {
            flex: 2;
            min-width: 300px;
        }
        .video-container {
            background: #2d3748;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 3px solid transparent;
            background: linear-gradient(135deg, #667eea, #764ba2) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        }
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 17px;
        }
        .info-section {
            flex: 1;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .sentence-card {
            background: linear-gradient(135deg, #667eea10, #764ba210);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }
        .sentence-card h3 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sentence-card h3 i {
            color: #667eea;
        }
        .sentence-display {
            background: white;
            border-radius: 30px;
            padding: 20px;
            min-height: 100px;
            font-size: 24px;
            font-weight: 500;
            color: #2d3748;
            border: 2px solid #e0e0e0;
            word-wrap: break-word;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        /* Style for clickable letters */
        .char {
            cursor: pointer;
            display: inline-block;
            padding: 2px;
            transition: background 0.2s;
        }
        .char:hover {
            background-color: rgba(102, 126, 234, 0.2);
            border-radius: 4px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1 1 auto;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 120px;
        }
        .btn-clear {
            background: linear-gradient(135deg, #f72585, #b5179e);
            color: white;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.3);
        }
        .btn-delete {
            background: linear-gradient(135deg, #fb8b24, #f45b0f);
            color: white;
            box-shadow: 0 4px 15px rgba(251, 139, 36, 0.3);
        }
        .btn-space {
            background: linear-gradient(135deg, #4cc9f0, #4895ef);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3);
        }
        .btn-voice {
            background: linear-gradient(135deg, #9d4edd, #7b2cbf);
            color: white;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .guide-card {
            background: linear-gradient(135deg, #4cc9f010, #4895ef10);
            border-radius: 15px;
            padding: 20px;
            border-left: 5px solid #4cc9f0;
        }
        .guide-card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .guide-card h3 i {
            color: #4cc9f0;
        }
        .gesture-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gesture-item {
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            font-weight: 600;
            color: #4a5568;
            border: 2px solid #e0e0e0;
            font-size: 14px;
        }
        .gesture-item.space {
            background: #4cc9f0;
            color: white;
            border-color: #4cc9f0;
        }
        .gesture-item.del {
            background: #f72585;
            color: white;
            border-color: #f72585;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(102, 126, 234, 0.3);
            color: #718096;
        }
        .status-badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery for AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-hands"></i>
                <h1>WELCOME TO SIGN LANGUAGE DETECTOR</h1>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>

        <div class="main-content">
            <!-- Video Section -->
            <div class="video-section">
                <div class="video-container">
                    <img src="{{ url_for('video') }}" alt="ASL Camera Feed">
                </div>
                <div style="text-align: center; margin-top: 15px;">
                    <span class="status-badge">
                        <i class="fas fa-circle" style="color: #48bb78; font-size: 10px;"></i> Live Detection Active
                    </span>
                </div>
            </div>

            <!-- Info Section -->
            <div class="info-section">
                <!-- Sentence Display (clickable letters) -->
                <div class="sentence-card">
                    <h3><i class="fas fa-comment"></i> Current Sentence (click any letter to delete)</h3>
                    <div class="sentence-display" id="sentenceDisplay"></div>
                </div>

                <!-- Action Buttons: Clear, Space, Delete, Voice -->
                <div class="button-group">
                    <button class="btn btn-clear" onclick="clearSentence()">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                    <button class="btn btn-space" onclick="addSpace()">
                        <i class="fas fa-space-shuttle"></i> Space
                    </button>
                    <button class="btn btn-delete" onclick="deleteLast()">
                        <i class="fas fa-backspace"></i> Delete Last
                    </button>
                    <button class="btn btn-voice" onclick="speakSentence()">
                        <i class="fas fa-volume-up"></i> Voice
                    </button>
                </div>

                <!-- Gesture Guide -->
                <div class="guide-card">
                    <h3><i class="fas fa-book-open"></i> Quick Guide</h3>
                    <div class="gesture-list">
                        <span class="gesture-item">A-Z</span>
                        <span class="gesture-item space">SPACE → Space</span>
                        <span class="gesture-item del">DEL → Delete</span>
                    </div>
                    <p style="margin-top: 15px; color: #718096; font-size: 14px;">
                        <i class="fas fa-info-circle"></i> Hold each sign for 2.5 seconds to add<br>
                        <i class="fas fa-mouse-pointer"></i> Click any letter above to delete it
                    </p>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2025 ASL Translator. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Function to update sentence with clickable spans
        function updateSentence() {
            $.get('/get_sentence', function(data) {
                var html = '';
                for (var i = 0; i < data.length; i++) {
                    var ch = data[i];
                    // Replace space with visible character? But we keep as space.
                    html += '<span class="char" data-index="' + i + '" onclick="deleteChar(' + i + ')">' + ch + '</span>';
                }
                $('#sentenceDisplay').html(html);
            });
        }

        // Delete character at specific index
        function deleteChar(index) {
            $.post('/delete_char/' + index, function() {
                updateSentence();
            }).fail(function() {
                console.log("Failed to delete character");
            });
        }

        // Clear all sentence
        function clearSentence() {
            $.get('/clear_sentence', function() {
                updateSentence();
            });
        }

        // Delete last character
        function deleteLast() {
            $.get('/delete_last', function() {
                updateSentence();
            });
        }

        // Add space to sentence
        function addSpace() {
            $.post('/add_space', function() {
                updateSentence();
            }).fail(function() {
                $.get('/add_space', function() {
                    updateSentence();
                });
            });
        }

        // Voice (Text-to-Speech) function
        function speakSentence() {
            var text = $('#sentenceDisplay').text(); // get plain text from spans
            if (text.trim() === '') {
                alert('No sentence to speak!');
                return;
            }
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1;
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        // Backspace key support: delete last character
        document.addEventListener('keydown', function(e) {
            if (e.key === "Backspace") {
                e.preventDefault(); // prevent browser back navigation
                deleteLast();
            }
        });

        // Auto-update sentence every 1 second
        setInterval(updateSentence, 1000);

        // Handle any AJAX errors
        $(document).ajaxError(function(event, jqxhr, settings, thrownError) {
            console.log("AJAX Error:", thrownError);
        });
    </script>
</body>
</html>
